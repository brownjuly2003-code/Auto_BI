name: gitleaks

# Secret scan on every push and PR (audit C-5). The action scans the pushed commit
# range (full history on schedule), so a leaked credential fails CI the moment it
# lands instead of living quietly in the public repo.
# Policy: current-tree synthetic canaries use narrow path+regex entries in
# .gitleaks.toml; exact historical false positives use fingerprint entries in
# .gitleaksignore. Never use inline suppression or broad commit/path exceptions.
on:
  push:
  pull_request:
  schedule:
    - cron: "15 6 * * 1"

jobs:
  scan:
    # Stable check-run name for repository rulesets (plan_sol step 5).
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
