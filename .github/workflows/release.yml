name: Release

# Fires only on a version tag push (git tag vX.Y.Z && git push origin vX.Y.Z), never on
# ordinary commits — cutting a release is a deliberate, separate act from merging to main
# (S10, closes D-1/D-2).
#
# plan_sol step 6 / audit P1-4 — promotion order:
#   preflight → (image-security ‖ pypi ‖ provenance) → finalize
# image-security: build (local load) → Trivy → image SBOM → push :version only → attest
# finalize (all three green): retag :latest, GitHub Release with source + image SBOM
# Mutable :latest and the GitHub Release never appear before security gates succeed.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write

jobs:
  # P1-7: a single gate that runs FIRST and fails the whole release unless the tag, the code
  # and the changelog agree on one version, the built sdist+wheel carry that version, and the
  # wheel actually installs and runs. Downstream jobs `needs` it so a stray tag publishes
  # NOTHING until coherence holds.
  preflight:
    name: Preflight — version coherence, changelog, build, smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Derive version from tag
        id: meta
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      # Fail fast, before building: tag == pyproject.toml [project].version ==
      # auto_bi.__version__, and CHANGELOG.md carries a non-empty `## [<version>]` section
      # (not just `## [Unreleased]`). The coherence + changelog checks live in a unit-tested
      # script (scripts/release_preflight.py, tests/test_release_preflight.py).
      - name: Check version coherence + changelog section
        run: uv run python scripts/release_preflight.py "$VERSION"

      # Build once here; the pypi job downloads these exact artifacts (below) instead of
      # rebuilding, so the published bits are the ones preflight checked — no rebuild drift.
      - name: Build sdist and wheel
        run: |
          rm -rf dist
          uv build

      - name: Verify built artifacts match the tag
        run: uv run python scripts/release_preflight.py "$VERSION" --dist-dir dist

      - name: Twine check
        run: uv run --with twine twine check dist/*

      # Clean-install smoke: install ONLY the freshly built wheel into a fresh, isolated
      # environment (`--no-project` => not the project's own .venv) and confirm the package
      # imports at the tagged version and the console script runs. Catches a wheel that builds
      # but can't be installed/used.
      - name: Clean-install smoke (import + console script)
        run: |
          wheel=$(ls dist/*.whl)
          uv run --isolated --no-project --with "$wheel" python -c "import auto_bi, os; v = os.environ['VERSION']; assert auto_bi.__version__ == v, auto_bi.__version__; print('import OK', auto_bi.__version__)"
          uv run --isolated --no-project --with "$wheel" auto_bi --help

      - name: Upload built distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # plan_sol step 6: scan + image SBOM before any mutable tag promotion.
  # Pushes ONLY :version (immutable ref for this tag). :latest is finalize's job.
  image-security:
    name: Image — build, scan, SBOM, version push, attest
    needs: preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
      version: ${{ steps.meta.outputs.version }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Derive version and image name
        id: meta
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          # GHCR requires a lowercase image path; github.repository preserves the repo's case.
          echo "image=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "local_tag=auto_bi-release:${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      # Build into the local docker daemon only — no registry write until Trivy is green.
      - name: Build image (local load, no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          load: true
          tags: ${{ steps.meta.outputs.local_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Fail the release before any GHCR tag if HIGH/CRITICAL with a fix are present.
      - name: Scan image (Trivy, before promotion)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.local_tag }}
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      # Runtime image SBOM (OS + Python packages) from the scanned local image.
      - name: Generate image SBOM (SPDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ steps.meta.outputs.local_tag }}
          format: spdx-json
          output-file: autobi-agent-image.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Upload image SBOM artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-sbom
          path: autobi-agent-image.spdx.json
          if-no-files-found: error

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Re-build with the same cache and push ONLY the immutable version tag (not :latest).
      - name: Push version tag only
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
          cache-from: type=gha

      - name: Attest image provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ${{ steps.meta.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  # X-2: PyPI publication via Trusted Publishing (OIDC) — no long-lived token in secrets.
  # Publishes the sdist+wheel built and verified by preflight (not a fresh rebuild).
  # Runs in parallel with image-security; GitHub Release waits for both (finalize).
  pypi:
    name: PyPI — trusted publish
    needs: preflight
    runs-on: ubuntu-latest
    # `environment: pypi` also gates this job behind any protection rules configured for that
    # environment in repo settings (Settings → Environments → pypi).
    environment:
      name: pypi
      url: https://pypi.org/project/autobi-agent/${{ needs.preflight.outputs.version }}/
    permissions:
      id-token: write  # OIDC: PyPI trusted publishing + PEP 740 attestation signing
      contents: read
    steps:
      - name: Download built distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist
      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          # PEP 740: under trusted publishing, gh-action-pypi-publish (v1.11+) signs and
          # uploads attestations by default via the ambient OIDC identity.
          attestations: true

  # Supply-chain: SLSA build provenance for the EXACT sdist+wheel that preflight built and
  # pypi publishes. Independent of image-security (package vs container).
  provenance:
    name: Provenance — sdist + wheel
    needs: preflight
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - name: Download built distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist
      - name: Attest build provenance (sdist + wheel)
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: "dist/*"

  # plan_sol step 6: public promotion only when image scan, PyPI, and package provenance
  # all succeeded. Partial failure (e.g. image red, PyPI green) leaves no :latest and no
  # GitHub Release — operator sees a failed workflow; residual PyPI package may exist
  # (cannot unpublish automatically; document in DEPLOYMENT).
  finalize:
    name: Finalize — latest tag + GitHub Release
    needs: [preflight, image-security, pypi, provenance]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Derive version and image name
        id: meta
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Promote :latest only after all gates. Retag from the already-scanned :version
      # (no rebuild) so latest always points at the scanned digest.
      - name: Promote latest from scanned version tag
        run: |
          set -euo pipefail
          IMAGE="${{ steps.meta.outputs.image }}"
          VER="${{ steps.meta.outputs.version }}"
          DIGEST="${{ needs.image-security.outputs.digest }}"
          # Prefer digest when available (immutable); fall back to version tag pull.
          if [ -n "$DIGEST" ]; then
            docker buildx imagetools create --tag "${IMAGE}:latest" "${IMAGE}@${DIGEST}"
          else
            docker buildx imagetools create --tag "${IMAGE}:latest" "${IMAGE}:${VER}"
          fi
          echo "promoted ${IMAGE}:latest -> ${IMAGE}@${DIGEST:-$VER}"

      - name: Extract changelog section
        run: |
          awk -v ver="${{ steps.meta.outputs.version }}" '
            BEGIN { found = 0 }
            /^## \[/ {
              if (found) exit
              if ($0 ~ ("\\[" ver "\\]")) { found = 1; next }
              next
            }
            found { print }
          ' CHANGELOG.md > release_notes.md

      # Source-tree SBOM (pyproject + uv.lock) for the package/release asset set.
      - name: Generate source SBOM (SPDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: spdx-json
          output-file: autobi-agent.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Download image SBOM
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: image-sbom
          path: .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          name: v${{ steps.meta.outputs.version }}
          body_path: release_notes.md
          generate_release_notes: false
          files: |
            autobi-agent.spdx.json
            autobi-agent-image.spdx.json

  # Always-run summary: fails loudly on partial publish (e.g. PyPI ok, image failed).
  release-status:
    name: Release status gate
    if: always()
    needs: [preflight, image-security, pypi, provenance, finalize]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require full success (no partial public release)
        run: |
          set -euo pipefail
          echo "preflight=${{ needs.preflight.result }}"
          echo "image-security=${{ needs.image-security.result }}"
          echo "pypi=${{ needs.pypi.result }}"
          echo "provenance=${{ needs.provenance.result }}"
          echo "finalize=${{ needs.finalize.result }}"
          fail=0
          for r in \
            "${{ needs.preflight.result }}" \
            "${{ needs.image-security.result }}" \
            "${{ needs.pypi.result }}" \
            "${{ needs.provenance.result }}" \
            "${{ needs.finalize.result }}"
          do
            if [ "$r" != "success" ]; then
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "::error::Partial or failed release — :latest and GitHub Release only appear when finalize succeeds. If pypi=success but image-security≠success, a wheel may already be on PyPI (manual residual)."
            exit 1
          fi
          echo "Full release promotion succeeded."
