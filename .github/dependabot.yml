# Version updates are off (open-pull-requests-limit: 0): the project is finished (ADR 0010)
# and published as is (ADR 0011), so a dependency bump is new work. The limit does not touch
# Dependabot security updates — a repository setting, kept on — which still open PRs for
# vulnerable dependencies. To bring version updates back, restore the limits (5 / 5 / 3).
version: 2
updates:
  # Python dependencies (pyproject.toml + uv.lock)
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    groups:
      # One weekly PR for non-major bumps; major stays separate so CI can fail isolated.
      python-dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  # GitHub Actions used by CI / release / gitleaks / CodeQL
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    groups:
      github-actions-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  # Docker base images referenced by Dockerfiles (digest pins still need manual bump
  # of the digest comment; version PRs are a heads-up only).
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
