title: Недельная маржа
charts:
- id: chart_1
  title: Выручка по регионам
  viz: bar
  query:
    table: dm.sales_daily
    dimensions:
    - region
    measures:
    - column: revenue
      agg: sum
    limit: 10000
- id: chart_2
  title: Маржа по регионам
  viz: table
  query:
    table: dm.sales_daily
    raw_sql: |-
      SELECT
      *,
      (
      SUM(gross_margin) / SUM(revenue)
      )
      FROM dm.sales_daily
- id: chart_3
  title: Операторский срез
  viz: table
  query:
    table: dm.weekly_margin_operator
    raw_sql: |-
      SELECT
      *
      FROM (
      SELECT region, sum(revenue) AS revenue
      FROM dm.sales_daily
      GROUP BY region
      ) AS virtual_table
