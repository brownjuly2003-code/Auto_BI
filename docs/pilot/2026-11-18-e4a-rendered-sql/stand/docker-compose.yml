# E4a stand (Mac only, colima profile autobi-linux, compose project e4a): ClickHouse 24.8 with the
# demo DM, Postgres 16 holding Superset's examples, and ONE Superset at a time — 4.1.2 (profile s41,
# port 8088) or 6.1.0 (profile s61, port 8089). Secrets live in .env (0600) and are never printed.
# Published ports bind 127.0.0.1 only. The colima VM has no host mounts: config and init are baked
# into the images (COPY), nothing is bind-mounted.

services:
  clickhouse:
    build: ./clickhouse
    container_name: e4a_clickhouse
    environment:
      CLICKHOUSE_DB: dm
      CLICKHOUSE_USER: admin
      CLICKHOUSE_PASSWORD: ${CH_ADMIN_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
      DEMO_FACT_ROWS: ${DEMO_FACT_ROWS}
      AUTO_BI_RO_PASSWORD: ${AUTO_BI_CH_PASSWORD}
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user admin --password \"$$CLICKHOUSE_PASSWORD\" --query 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  postgres:
    build: ./postgres
    container_name: e4a_postgres
    environment:
      POSTGRES_USER: examples
      POSTGRES_PASSWORD: ${PG_EXAMPLES_PASSWORD}
      POSTGRES_DB: examples_41
      LC_ALL: C.UTF-8
    command: ["postgres", "-c", "log_line_prefix=%m [%p] db=%d user=%u app=%a ", "-c", "log_destination=stderr"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U examples -d examples_41"]
      interval: 10s
      timeout: 5s
      retries: 30

  superset41:
    profiles: ["s41"]
    build: ./superset41
    container_name: e4a_superset41
    ports:
      - "127.0.0.1:8088:8088"
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
      ADMIN_USERNAME: ${AUTO_BI_SUPERSET_USER}
      ADMIN_PASSWORD: ${AUTO_BI_SUPERSET_PASSWORD}
      E4A_EXAMPLES_URI: postgresql://examples:${PG_EXAMPLES_PASSWORD}@postgres:5432/examples_41
    volumes:
      - superset41_home:/app/superset_home
    depends_on:
      clickhouse: { condition: service_healthy }
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/health"]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 90s

  superset61:
    profiles: ["s61"]
    build: ./superset61
    container_name: e4a_superset61
    ports:
      - "127.0.0.1:8089:8088"
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
      ADMIN_USERNAME: ${AUTO_BI_SUPERSET_USER}
      ADMIN_PASSWORD: ${AUTO_BI_SUPERSET_PASSWORD}
      E4A_EXAMPLES_URI: postgresql://examples:${PG_EXAMPLES_PASSWORD}@postgres:5432/examples_61
    volumes:
      - superset61_home:/app/superset_home
    depends_on:
      clickhouse: { condition: service_healthy }
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/health"]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 90s

volumes:
  clickhouse_data:
  postgres_data:
  superset41_home:
  superset61_home:
