[project]
name = "autobi-agent"
version = "0.6.0.dev0"
description = "Analytics Release & Evidence Gate (DecisionOps): checks that a semantic change keeps governed numbers, with content-addressed evidence"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Julia Edomskikh" }]
keywords = ["bi", "dashboard", "superset", "datalens", "clickhouse", "llm", "agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Database :: Front-Ends",
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.12",
    "pydantic-settings>=2.14.2",
    "httpx>=0.27",
    "sqlglot>=30.12.0",
    "pyyaml>=6.0.1",
    "rich>=13.7",
    "clickhouse-connect>=1.4.2",
    "fastapi>=0.139.0",
    "uvicorn>=0.50.2",
    "psycopg[binary]>=3.3.4",
    "anthropic>=0.116.0",
    "cryptography>=45.0",
]

[project.optional-dependencies]
# No-op alias: anthropic is a core dependency (audit P1-3). Kept so older install
# lines (`pip install 'autobi-agent[anthropic]'` / `uv sync --extra anthropic`) still work.
anthropic = []

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.20",
    "black>=24.4",
    "pre-commit>=3.7",
]

[project.scripts]
auto_bi = "auto_bi.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["auto_bi"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".tmp"]  # scratch scripts, not part of the codebase

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
# Russian text in prompts/fixtures is by design, not a homoglyph typo
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.black]
target-version = ["py312"]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires running ClickHouse/Superset stand (docker, runs on Mac)",
    "e2e: browser E2E (Playwright + axe) against `auto_bi serve` and the live stand",
]
addopts = "-m 'not integration and not e2e'"
# D-4: warnings are errors; every allowlisted entry must name a concrete third-party
# warning we cannot fix ourselves (never a blanket ignore of our own code).
filterwarnings = [
    "error",
    # fastapi's own `from starlette.testclient import ...` — upstream migration to
    # httpx2 pending; not triggerable from auto_bi code.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]

# Coverage is measured in CI and locally via:
#   uv run --with pytest-cov pytest --cov=auto_bi --cov-report=term-missing
# duckdb is an ephemeral test-only dep (like pytest-cov) — it runs the transform SQL's
# numeric check (tests/test_sqlgen_transforms.py) under PostgreSQL window semantics:
#   uv run --with duckdb pytest tests/test_sqlgen_transforms.py
# Without it those tests `importorskip` and skip; CI passes `--with duckdb` so they run.
[tool.coverage.run]
source = ["auto_bi"]
omit = ["*/__init__.py"]

# plan_sol step 12: bounded mutation smoke. mutmut 3 requires fork support, so this
# runs in the primary Ubuntu CI job (or WSL locally), never in native Windows Python.
[tool.mutmut]
source_paths = ["auto_bi/"]
only_mutate = [
    "auto_bi/agent/sql_guard.py",
    "auto_bi/ir/validate.py",
    "auto_bi/agent/dataset_plan.py",
    "auto_bi/agent/cleanup.py",
]
# Parallel pytest temp-root cleanup races turn warnings into false kills.
# 2026-11-03: these filters made all 25 Mac-only kills survive, with no warnings.
pytest_add_cli_args = [
    "-W", "ignore:unclosed scandir iterator:ResourceWarning",
    "-W", "ignore:(rm_rf) error removing:pytest.PytestWarning",
]
pytest_add_cli_args_test_selection = [
    "tests/test_property_quality.py",
    "tests/test_ir_validate.py",
    "tests/test_x5_raw_sql.py",
    "tests/test_p1_6_governance.py",
    "tests/test_query_plan.py",
    "tests/test_dataset_plan.py",
    "tests/test_native_filters.py",
    "tests/test_pipeline.py",
