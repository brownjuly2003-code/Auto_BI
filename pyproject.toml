also_copy = ["semantic/"]

# mypy is run on auto_bi (not tests, whose fixtures use loose typing by design). Run via:
#   uv run --with mypy --with types-PyYAML mypy auto_bi
# types-PyYAML is pulled in ephemerally to keep uv.lock lean, mirroring pytest-cov in CI.
[tool.mypy]
python_version = "3.12"
files = ["auto_bi"]
# The canonical strict gate is package-wide and explicit at the CLI/CI boundary:
#   uv run --with mypy --with types-PyYAML mypy --strict auto_bi
# Do NOT set global `strict = true` here: on our mypy version that polluted
# package-wide checks. See docs/operations/SLO.md «Mypy package-wide strict gate».

[[tool.mypy.overrides]]
# anthropic / clickhouse_connect ship no usable py.typed stubs for our mypy gate.
module = ["anthropic", "clickhouse_connect", "clickhouse_connect.*"]
ignore_missing_imports = true
